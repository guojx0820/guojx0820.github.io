<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">RF-DETR 缺陷检测平台架构图</title>
  <desc id="desc">Tauri 桌面前端、Go 后端、Python RF-DETR worker 和模型权重之间的本地运行关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".55" stop-color="#164e63"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#dff7ff" stop-opacity=".86"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="34" fill="url(#bg)"/>
  <g opacity=".24">
    <circle cx="120" cy="90" r="90" fill="#38bdf8"/>
    <circle cx="1080" cy="470" r="120" fill="#a78bfa"/>
    <circle cx="790" cy="120" r="70" fill="#22c55e"/>
  </g>
  <text x="64" y="78" fill="#fff" font-size="40" font-weight="800" font-family="Segoe UI, Microsoft YaHei, sans-serif">RF-DETR 缺陷检测平台</text>
  <text x="66" y="116" fill="#c7f9ff" font-size="20" font-family="Segoe UI, Microsoft YaHei, sans-serif">Windows 本地训练 · ONNX 推理 · Tauri 桌面软件 · Go 后端 · Python .venv</text>
  <g filter="url(#shadow)" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="70" y="190" width="240" height="150" rx="24" fill="url(#card)"/>
    <text x="105" y="246" font-size="26" fill="#0f172a" font-weight="800">Tauri 桌面前端</text>
    <text x="105" y="285" font-size="18" fill="#334155">React + TypeScript</text>
    <text x="105" y="315" font-size="18" fill="#334155">训练 / 推理 / 日志 / 结果</text>
    <rect x="370" y="190" width="240" height="150" rx="24" fill="url(#card)"/>
    <text x="410" y="246" font-size="26" fill="#0f172a" font-weight="800">Go Vision Core</text>
    <text x="410" y="285" font-size="18" fill="#334155">REST API + 任务队列</text>
    <text x="410" y="315" font-size="18" fill="#334155">127.0.0.1:18080</text>
    <rect x="670" y="190" width="240" height="150" rx="24" fill="url(#card)"/>
    <text x="705" y="246" font-size="26" fill="#0f172a" font-weight="800">Python Worker</text>
    <text x="705" y="285" font-size="18" fill="#334155">.venv + RF-DETR</text>
    <text x="705" y="315" font-size="18" fill="#334155">训练 / 导出 / 批量推理</text>
    <rect x="940" y="190" width="190" height="150" rx="24" fill="url(#card)"/>
    <text x="975" y="246" font-size="26" fill="#0f172a" font-weight="800">模型权重</text>
    <text x="975" y="285" font-size="18" fill="#334155">Nano / Medium</text>
    <text x="975" y="315" font-size="18" fill="#334155">Large 可选下载</text>
  </g>
  <g stroke="#67e8f9" stroke-width="7" fill="none" marker-end="url(#arrow)" opacity=".95">
    <path d="M315 265 H360"/>
    <path d="M615 265 H660"/>
    <path d="M915 265 H935"/>
  </g>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="90" y="405" width="1020" height="74" rx="18" fill="#020617" opacity=".42"/>
    <text x="124" y="451" fill="#e0f2fe" font-size="22">下载 ZIP → 解压 → 配置 .venv → 下载权重 → 双击启动 Tauri 桌面软件</text>
  </g>
</svg>
