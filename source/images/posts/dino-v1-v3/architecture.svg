<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#eafff8"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2674ad"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".16"/></filter></defs><rect width="1280" height="760" fill="url(#bg)"/><text x="640" y="70" text-anchor="middle" font-size="42" font-weight="800" fill="#163247" font-family="Microsoft YaHei,Segoe UI,Arial">DINO 系列通用结构：自己教自己看图</text><g filter="url(#s)" font-family="Microsoft YaHei,Segoe UI,Arial"><rect x="70" y="190" width="180" height="130" rx="24" fill="#fff" stroke="#8bd1ff" stroke-width="3"/><text x="160" y="250" text-anchor="middle" font-size="28" font-weight="800" fill="#18354a">多视角增强</text><text x="160" y="287" text-anchor="middle" font-size="20" fill="#567">crop / color / blur</text><rect x="330" y="130" width="230" height="200" rx="28" fill="#eef7ff" stroke="#6aa8ff" stroke-width="3"/><text x="445" y="200" text-anchor="middle" font-size="30" font-weight="800" fill="#183b70">Student ViT</text><text x="445" y="242" text-anchor="middle" font-size="21" fill="#456">接收局部与全局视图</text><text x="445" y="280" text-anchor="middle" font-size="21" fill="#456">反向传播更新</text><rect x="330" y="430" width="230" height="200" rx="28" fill="#f2fffb" stroke="#24c7ad" stroke-width="3"/><text x="445" y="500" text-anchor="middle" font-size="30" font-weight="800" fill="#065b52">Teacher ViT</text><text x="445" y="542" text-anchor="middle" font-size="21" fill="#456">EMA 慢更新</text><text x="445" y="580" text-anchor="middle" font-size="21" fill="#456">提供稳定目标</text><rect x="675" y="230" width="250" height="160" rx="26" fill="#fff8df" stroke="#f1b83f" stroke-width="3"/><text x="800" y="292" text-anchor="middle" font-size="29" font-weight="800" fill="#694a08">自蒸馏损失</text><text x="800" y="336" text-anchor="middle" font-size="21" fill="#66542b">让 student 输出接近 teacher</text><rect x="1010" y="230" width="200" height="160" rx="26" fill="#fff" stroke="#ff8996" stroke-width="3"/><text x="1110" y="292" text-anchor="middle" font-size="29" font-weight="800" fill="#70303c">语义特征</text><text x="1110" y="336" text-anchor="middle" font-size="21" fill="#664b54">分类 / 检索 / 分割</text></g><g stroke="#2674ad" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M250 255H330"/><path d="M560 230C620 230 620 280 675 280"/><path d="M560 530C640 530 640 350 675 350"/><path d="M925 310H1010"/><path d="M445 430V344"/></g><text x="640" y="700" text-anchor="middle" font-size="24" fill="#426277" font-family="Microsoft YaHei,Segoe UI,Arial">直觉：teacher 像稳定老师，student 像努力学生；没有人工标签，也能通过一致性学习出语义。</text></svg>
