<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Transformer 数据流</title>
  <desc id="desc">展示 token、embedding、注意力、前馈网络和输出 logits 的数据流。</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2746"/>
      <stop offset="1" stop-color="#176b87"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f7ff"/>
      <stop offset="1" stop-color="#b8e8ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6f8b"/>
    </marker>
    <style>
      .label{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:28px;font-weight:700;fill:#08304b}
      .small{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:19px;fill:#24475b}
      .box{fill:url(#g2);stroke:#1f6f8b;stroke-width:3;rx:18}
      .core{fill:url(#g1);stroke:#80d8ff;stroke-width:3;rx:24}
      .coreText{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:25px;font-weight:700;fill:#fff}
      .arrow{stroke:#1f6f8b;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f7fbfd"/>
  <text x="600" y="58" text-anchor="middle" class="label">Transformer Decoder：从文本到下一个 Token</text>
  <rect x="45" y="145" width="160" height="92" class="box"/>
  <text x="125" y="183" text-anchor="middle" class="label">文本</text>
  <text x="125" y="214" text-anchor="middle" class="small">prompt</text>
  <path class="arrow" d="M 210 190 H 295"/>
  <rect x="300" y="130" width="180" height="122" class="box"/>
  <text x="390" y="176" text-anchor="middle" class="label">Tokenize</text>
  <text x="390" y="211" text-anchor="middle" class="small">离散 ID 序列</text>
  <path class="arrow" d="M 485 190 H 565"/>
  <rect x="570" y="130" width="190" height="122" class="box"/>
  <text x="665" y="171" text-anchor="middle" class="label">Embedding</text>
  <text x="665" y="205" text-anchor="middle" class="small">词向量 + 位置</text>
  <path class="arrow" d="M 765 190 H 845"/>
  <rect x="850" y="95" width="300" height="195" class="core"/>
  <text x="1000" y="147" text-anchor="middle" class="coreText">N 层 Decoder Block</text>
  <text x="1000" y="190" text-anchor="middle" class="coreText">Masked MHA + MLP</text>
  <text x="1000" y="232" text-anchor="middle" class="coreText">残差 + LayerNorm</text>
  <path class="arrow" d="M 1000 294 V 365"/>
  <rect x="850" y="370" width="300" height="112" class="box"/>
  <text x="1000" y="414" text-anchor="middle" class="label">Linear + Softmax</text>
  <text x="1000" y="450" text-anchor="middle" class="small">下一个 token 概率</text>
  <path class="arrow" d="M 850 426 H 740 C 690 426 690 265 740 252"/>
  <text x="668" y="435" class="small">自回归循环</text>
  <g transform="translate(125 356)">
    <rect x="0" y="0" width="66" height="66" fill="#d7f2ff" stroke="#1f6f8b" rx="10"/>
    <rect x="82" y="0" width="66" height="66" fill="#d7f2ff" stroke="#1f6f8b" rx="10"/>
    <rect x="164" y="0" width="66" height="66" fill="#d7f2ff" stroke="#1f6f8b" rx="10"/>
    <text x="33" y="41" text-anchor="middle" class="small">我</text>
    <text x="115" y="41" text-anchor="middle" class="small">们</text>
    <text x="197" y="41" text-anchor="middle" class="small">学习</text>
  </g>
  <text x="125" y="463" class="small">因果掩码保证当前位置只能看见历史 token。</text>
</svg>
