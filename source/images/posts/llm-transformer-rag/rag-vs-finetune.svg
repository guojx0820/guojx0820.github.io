<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">RAG 与微调选择图</title>
  <desc id="desc">根据知识时效、输出风格、成本和可解释性选择 RAG、微调或组合方案。</desc>
  <style>
    .t{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#092b3a}
    .h{font-size:28px;font-weight:700}
    .s{font-size:20px}
    .cell{fill:#f2fbff;stroke:#267591;stroke-width:3;rx:18}
    .rag{fill:#e8f7ff}
    .ft{fill:#fff0d6}
    .both{fill:#edf7e8}
  </style>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="55" text-anchor="middle" class="t h">先问知识是否变化，再问行为是否需要学习</text>
  <rect x="80" y="115" width="300" height="130" class="cell rag"/>
  <text x="230" y="165" text-anchor="middle" class="t h">优先 RAG</text>
  <text x="230" y="202" text-anchor="middle" class="t s">知识频繁变化</text>
  <text x="230" y="230" text-anchor="middle" class="t s">需要引用来源</text>
  <rect x="450" y="115" width="300" height="130" class="cell ft"/>
  <text x="600" y="165" text-anchor="middle" class="t h">优先微调</text>
  <text x="600" y="202" text-anchor="middle" class="t s">固定风格或格式</text>
  <text x="600" y="230" text-anchor="middle" class="t s">领域术语稳定</text>
  <rect x="820" y="115" width="300" height="130" class="cell both"/>
  <text x="970" y="165" text-anchor="middle" class="t h">组合方案</text>
  <text x="970" y="202" text-anchor="middle" class="t s">知识与流程都重要</text>
  <text x="970" y="230" text-anchor="middle" class="t s">先 RAG 后轻微调</text>
  <rect x="80" y="315" width="1040" height="145" class="cell"/>
  <text x="130" y="365" class="t h">工程判断</text>
  <text x="130" y="405" class="t s">RAG 改“模型能看到什么”，微调改“模型倾向怎么说、怎么做”。</text>
  <text x="130" y="438" class="t s">多数企业知识问答先从 RAG 做起；只有当输出格式、业务口径和工具调用习惯需要稳定内化时，再做 LoRA/QLoRA。</text>
</svg>
