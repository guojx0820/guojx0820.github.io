<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="RF-DETR inference pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071421"/><stop offset="1" stop-color="#143f56"/></linearGradient>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,7 L10,3.5 z" fill="#adf7ff"/></marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="640" y="72" text-anchor="middle" font-size="42" font-weight="800" fill="#ffffff" font-family="Microsoft YaHei, Segoe UI, Arial">RF-DETR 推理部署链路</text>
  <g font-family="Microsoft YaHei, Segoe UI, Arial">
    <g fill="#ffffff" fill-opacity=".12" stroke="#88f0ff" stroke-width="2.5">
      <rect x="74" y="170" width="190" height="130" rx="24"/>
      <rect x="326" y="170" width="190" height="130" rx="24"/>
      <rect x="578" y="170" width="190" height="130" rx="24"/>
      <rect x="830" y="170" width="190" height="130" rx="24"/>
      <rect x="1050" y="170" width="160" height="130" rx="24"/>
    </g>
    <text x="169" y="220" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">输入图片</text>
    <text x="169" y="258" text-anchor="middle" font-size="18" fill="#bdefff">摄像头 / 文件 / API</text>
    <text x="421" y="220" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">预处理</text>
    <text x="421" y="258" text-anchor="middle" font-size="18" fill="#bdefff">尺寸、归一化、batch</text>
    <text x="673" y="220" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">模型前向</text>
    <text x="673" y="258" text-anchor="middle" font-size="18" fill="#bdefff">RF-DETR</text>
    <text x="925" y="220" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">后处理</text>
    <text x="925" y="258" text-anchor="middle" font-size="18" fill="#bdefff">阈值过滤 / 坐标还原</text>
    <text x="1130" y="220" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">结果</text>
    <text x="1130" y="258" text-anchor="middle" font-size="18" fill="#bdefff">框、类别、分数</text>
    <g stroke="#adf7ff" stroke-width="4" fill="none" marker-end="url(#arrow)">
      <path d="M264 235H326"/><path d="M516 235H578"/><path d="M768 235H830"/><path d="M1020 235H1050"/>
    </g>
    <rect x="128" y="408" width="1024" height="160" rx="30" fill="#ffffff" fill-opacity=".1" stroke="#6ceccf" stroke-width="2"/>
    <text x="640" y="458" text-anchor="middle" font-size="27" font-weight="800" fill="#dffff8">工程经验</text>
    <text x="640" y="503" text-anchor="middle" font-size="22" fill="#d7faff">小模型优先试通链路，大模型用于追求精度；线上部署关注 P95 延迟、显存、吞吐和失败样本回流。</text>
    <text x="640" y="542" text-anchor="middle" font-size="22" fill="#d7faff">如果要上边缘设备，优先评估 ONNX/TensorRT 导出后的真实速度，而不是只看论文表格。</text>
  </g>
</svg>
