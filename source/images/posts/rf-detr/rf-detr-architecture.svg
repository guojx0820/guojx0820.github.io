<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="RF-DETR architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e6fff9"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L12,4 z" fill="#2470a8"/></marker>
    <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#87a" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="640" y="70" text-anchor="middle" font-size="42" font-weight="800" fill="#153047" font-family="Microsoft YaHei, Segoe UI, Arial">RF-DETR 网络结构：从图像到检测框</text>
  <g font-family="Microsoft YaHei, Segoe UI, Arial" filter="url(#s)">
    <rect x="60" y="190" width="180" height="170" rx="24" fill="#ffffff" stroke="#7fc9ff" stroke-width="3"/>
    <text x="150" y="252" text-anchor="middle" font-size="28" font-weight="700" fill="#153047">输入图像</text>
    <text x="150" y="296" text-anchor="middle" font-size="20" fill="#5d7181">Resize / Normalize</text>
    <rect x="92" y="318" width="116" height="26" rx="8" fill="#d3f2ff"/>

    <rect x="310" y="150" width="210" height="250" rx="26" fill="#eaffff" stroke="#00a8a8" stroke-width="3"/>
    <text x="415" y="220" text-anchor="middle" font-size="29" font-weight="800" fill="#063f4d">DINOv2</text>
    <text x="415" y="258" text-anchor="middle" font-size="22" fill="#305666">视觉骨干</text>
    <text x="415" y="309" text-anchor="middle" font-size="19" fill="#55717d">提取多尺度语义特征</text>
    <text x="415" y="342" text-anchor="middle" font-size="19" fill="#55717d">保留形状、纹理与位置线索</text>

    <rect x="590" y="150" width="210" height="250" rx="26" fill="#f1f7ff" stroke="#4f95ff" stroke-width="3"/>
    <text x="695" y="218" text-anchor="middle" font-size="28" font-weight="800" fill="#183b70">特征投影</text>
    <text x="695" y="260" text-anchor="middle" font-size="21" fill="#456485">把 backbone 特征</text>
    <text x="695" y="294" text-anchor="middle" font-size="21" fill="#456485">整理成 Transformer 可读序列</text>
    <rect x="640" y="330" width="110" height="28" rx="8" fill="#dbeaff"/>

    <rect x="870" y="150" width="240" height="250" rx="26" fill="#fff7df" stroke="#f2b531" stroke-width="3"/>
    <text x="990" y="218" text-anchor="middle" font-size="28" font-weight="800" fill="#72510e">Detection Transformer</text>
    <text x="990" y="260" text-anchor="middle" font-size="21" fill="#66542b">目标查询 Object Queries</text>
    <text x="990" y="294" text-anchor="middle" font-size="21" fill="#66542b">跨注意力读取图像特征</text>
    <text x="990" y="328" text-anchor="middle" font-size="21" fill="#66542b">输出一组候选目标</text>

    <rect x="465" y="500" width="350" height="110" rx="24" fill="#ffffff" stroke="#ff7c8a" stroke-width="3"/>
    <text x="640" y="548" text-anchor="middle" font-size="26" font-weight="800" fill="#713540">预测头 + 匈牙利匹配</text>
    <text x="640" y="586" text-anchor="middle" font-size="20" fill="#72515a">类别、边界框、置信度；训练时一对一匹配</text>

    <rect x="910" y="500" width="230" height="110" rx="24" fill="#ecfff2" stroke="#3ac66f" stroke-width="3"/>
    <text x="1025" y="548" text-anchor="middle" font-size="26" font-weight="800" fill="#14552d">最终结果</text>
    <text x="1025" y="586" text-anchor="middle" font-size="20" fill="#42644f">框 / 类别 / 分数</text>
  </g>
  <g stroke="#2470a8" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M240 275H310"/>
    <path d="M520 275H590"/>
    <path d="M800 275H870"/>
    <path d="M990 400C990 455 800 455 760 500"/>
    <path d="M815 555H910"/>
  </g>
  <text x="640" y="690" text-anchor="middle" font-size="24" fill="#426277" font-family="Microsoft YaHei, Segoe UI, Arial">理解重点：RF-DETR 不是先生成一堆候选框再筛选，而是直接预测“这一张图里有哪些目标”。</text>
</svg>
