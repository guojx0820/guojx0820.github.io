# Hexo Configuration
# Docs: https://hexo.io/docs/configuration.html

# Site
title: 洛沐の人间客栈
subtitle: '和光同尘，与时舒卷'
description: C'est la vie!
keywords: LuoMu
author: 洛沐
language: zh-CN
timezone: Asia/Shanghai
email: guojiaxiang0820@gmail.com

# URL
url: https://www.guojxblog.cn
root: /
permalink: archives/:abbrlink.html
abbrlink:
  alg: crc32
  rep: hex
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude files
include:
exclude:
ignore:

# Search
search:
  path: search.xml
  field: post
  format: html
  limit: 10000

# Sitemap
sitemap:
  path: sitemap.xml

# Nofollow
nofollow:
  enable: true
  field: site
  exclude: ''

# Lazyload
lazyload:
  enable: true
  onlypost: false
  loadingImg: https://luomublog.oss-cn-qingdao.aliyuncs.com/ImgHost/loading3.gif
  isSPA: true
  preloadRatio: 3

# MathJax loads only when a page/post sets mathjax: true.
mathjax:
  tags: none
  single_dollars: true
  cjk_width: 0.9
  normal_width: 0.6
  append_css: true
  every_page: false

theme: butterfly
