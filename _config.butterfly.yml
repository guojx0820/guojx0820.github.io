# Butterfly theme overrides for LuoMu Blog.
# The full default config comes from hexo-theme-butterfly 5.7.0.

menu:
  首页: / || fas fa-home
  文章 || fa fa-graduation-cap || hide:
    归档: /archives/ || fa fa-folder-open
    分类: /categories/ || fa fa-archive
    标签: /tags/ || fa fa-tags
  生活 || fa-solid fa-heart-pulse || hide:
    读书: /books/ || fas fa-book-reader
    相册: /photos/ || fa fa-camera-retro
    音乐: /music/ || fa fa-music
    影视: /movies/ || fas fa-video
  动态 || fa-solid fa-keyboard || hide:
    留言: /comment/ || fa fa-paper-plane
    随笔: /notes/ || fas fa-feather-alt
    妙想: /ideas/ || fa-solid fa-lightbulb
  友链: /link/ || fa fa-link
  关于: /about/ || fas fa-heart

hide_sidebar_menu_child: true

highlight_theme: mac
highlight_copy: true
highlight_lang: true
highlight_shrink: false
highlight_height_limit: 500
code_word_wrap: false

copy:
  enable: true
  copyright:
    enable: true
    limit_count: 50

social:
  fab fa-github: https://github.com/guojx0820 || Github
  fas fa-envelope: mailto:guojiaxiang0820@gmail.com || Email
  fab fa-weibo: https://weibo.com/u/5056152295 || Weibo
  fas fa-code: https://blog.csdn.net/qq_41799597?type=blog || CSDN
  fas fa-book: https://www.jianshu.com/u/899c06e14064 || 简书

algolia_search:
  enable: false

local_search:
  enable: true
  preload: false
  CDN:
  labels:
    input_placeholder: 搜索文章
    hits_empty: "没有搜到相关内容: ${query}"

mathjax:
  enable: true
  per_page: false

katex:
  enable: false
  per_page: false
  hide_scrollbar: true

favicon: https://luomublog.oss-cn-qingdao.aliyuncs.com/ImgHost/RS_icon.jpg

avatar:
  img: https://luomublog.oss-cn-qingdao.aliyuncs.com/ImgHost/touxiang.jpeg
  effect: false

disable_top_img: false
index_img: https://luomublog.oss-cn-qingdao.aliyuncs.com/ImgHost/bg_girl.jpg
default_top_img: https://luomublog.oss-cn-qingdao.aliyuncs.com/ImgHost/bg_beauty.jpg
archive_img: https://luomublog.oss-cn-qingdao.aliyuncs.com/ImgHost/bg_deer.jpg
tag_img: https://luomublog.oss-cn-qingdao.aliyuncs.com/ImgHost/bg_beauty.jpg
tag_per_img:
category_img: https://luomublog.oss-cn-qingdao.aliyuncs.com/ImgHost/bg_beauty1.jpeg
category_per_img:

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: both
  default_cover:
    - https://cdn.jsdelivr.net/gh/jerryc127/CDN@latest/cover/default_bg.png
    - https://cdn.jsdelivr.net/gh/jerryc127/CDN@latest/cover/default_bg2.png
    - https://cdn.jsdelivr.net/gh/jerryc127/CDN@latest/cover/default_bg3.png

error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

error_404:
  enable: true
  subtitle: '页面找不到啦～'
  background: https://i.loli.net/2020/05/19/aKOcLiyPl2JQdFD.png

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    date_type: both
    date_format: relative
    categories: true
    tags: true
    label: true

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

index_post_content:
  method: 2
  length: 500

anchor: true

toc:
  post: true
  page: true
  number: true
  expand: true
  style_simple: true

post_copyright:
  enable: true
  decode: false
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

reward:
  enable: true
  QR_code:
    - img: https://luomublog.oss-cn-qingdao.aliyuncs.com/ImgHost/wechat.jpeg
      link: https://luomublog.oss-cn-qingdao.aliyuncs.com/ImgHost/wechat.jpeg
      text: 微信
    - img: https://luomublog.oss-cn-qingdao.aliyuncs.com/ImgHost/alipay.jpeg
      link: https://luomublog.oss-cn-qingdao.aliyuncs.com/ImgHost/alipay.jpeg
      text: 支付宝

related_post:
  enable: true
  limit: 6
  date_type: created

photofigcaption: true
post_pagination: 1

noticeOutdate:
  enable: true
  style: flat
  limit_day: 180
  position: top
  message_prev: 此文中创建于
  message_next: 天之前，请以最新文章为准！

rightside-bottom:
enter_transitions: true
display_mode: light

share:
  use:
  sharejs:
    sites: facebook,x,wechat,weibo,qq
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link

comments:
  use:
  text: true
  lazyload: false
  count: false

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

canvas_ribbon:
  enable: false
canvas_fluttering_ribbon:
  enable: false
canvas_nest:
  enable: false
activate_power_mode:
  enable: false
fireworks:
  enable: false
click_heart:
  enable: false
  mobile: false
clickShowText:
  enable: false

snackbar:
  enable: false
  position: bottom-left
  bg_light: '#49b1f5'
  bg_dark: '#1f1f1f'

instantpage: false
pangu:
  enable: true
  field: site

lazyload:
  enable: true
  field: site
  placeholder: https://luomublog.oss-cn-qingdao.aliyuncs.com/ImgHost/loading3.gif
  blur: false

live2d:
  enable: false

inject:
  head:
    - <link rel="stylesheet" href="/css/iconfont.css">
  bottom:

CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
  custom_format:
  option:
    fontawesome: /vendor/fontawesome/css/all.min.css
